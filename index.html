<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Водный-о-метр</title>
<meta name="theme-color" content="#120f1c">
<meta name="description" content="Можно ли Станиславу сегодня водный: давление, ветер, температура и осадки.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Водный">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: lounge at night. Hookah with live smoke on the left, verdict on the right, 7-day strip and weather factors below. */
:root {
  --bg: #120f1c;
  --bg-2: #1c1730;
  --panel: rgba(255,255,255,.045);
  --line: rgba(255,255,255,.09);
  --fg: #efe9f7;
  --muted: #a49cb8;
  --ember: #ff9a3c;
  --ember-2: #ff5e3a;
  --ok: #57d6a4;
  --warn: #ffc94d;
  --bad: #ff5d6c;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --verdict: var(--ember);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::after {
  content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40% 35% at 25% 30%, color-mix(in oklab, var(--verdict) 22%, transparent), transparent 70%),
    radial-gradient(35% 30% at 80% 75%, rgba(120, 90, 255, .16), transparent 70%),
    linear-gradient(180deg, var(--bg), var(--bg-2));
  animation: drift 18s ease-in-out infinite alternate;
  transition: background 1s;
}
@keyframes drift { to { transform: translate3d(4%, -3%, 0) rotate(3deg); } }

.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 60px; display: grid; gap: 28px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.brand { font: 900 clamp(22px, 4vw, 30px)/1 var(--display); letter-spacing: -.02em; }
.brand span { color: var(--ember); }
.loc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.loc-name { color: var(--muted); font-weight: 600; }
.loc form { display: flex; gap: 6px; }
input, button { font: inherit; color: inherit; }
input {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; width: 170px;
}
button {
  cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; font-weight: 700;
  transition: transform .15s, background .2s, border-color .2s;
}
button:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.2); }
button:active { transform: scale(.96); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; }
.stage { position: relative; aspect-ratio: 3 / 4; max-width: 100%; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage svg { position: absolute; left: 50%; bottom: 0; width: 62%; transform: translateX(-50%); }
.lift { animation: lift 4.5s ease-in-out infinite; }
@keyframes lift { 0%,100% { transform: translateY(8px); } 50% { transform: translateY(-14px); } }
.fill { animation: fill 4.5s ease-in-out infinite; transform-origin: 60px 172px; transform-box: view-box; }
@keyframes fill { 0%,100% { transform: scaleY(.15); opacity: .35; } 50% { transform: scaleY(1); opacity: .85; } }
.ember { animation: glow 1.6s ease-in-out infinite; }
.ember.e2 { animation-delay: .5s; } .ember.e3 { animation-delay: 1s; }
@keyframes glow { 0%,100% { fill: #ff5e3a; filter: drop-shadow(0 0 2px #ff5e3a); } 50% { fill: #ffd27a; filter: drop-shadow(0 0 7px #ff9a3c); } }
.wave { animation: wave 2.2s ease-in-out infinite; }
@keyframes wave { 50% { transform: translateX(-10px); } }
.bubble { animation: bub 1.8s ease-in infinite; opacity: 0; }
@keyframes bub { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-30px) scale(1.1); opacity: 0; } }

.verdict-card { display: grid; gap: 14px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.verdict-title {
  font: 900 clamp(30px, 5.4vw, 54px)/1.02 var(--display); letter-spacing: -.03em; margin: 0; text-wrap: balance;
  color: var(--verdict); transition: color .6s;
}
.verdict-sub { margin: 0; font-size: 17px; color: var(--fg); max-width: 52ch; }
.score { display: flex; align-items: center; gap: 14px; }
.score-ring { width: 64px; height: 64px; }
.score-ring circle { fill: none; stroke-width: 7; }
.score-ring .track { stroke: var(--line); }
.score-ring .val { stroke: var(--verdict); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1), stroke .6s; }
.score-num { font: 700 24px var(--display); }
.score-cap { color: var(--muted); font-size: 13px; }

/* Days */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day {
  display: grid; justify-items: center; gap: 4px; padding: 12px 4px; border-radius: 14px; text-align: center;
  background: var(--panel); border: 1px solid var(--line);
  opacity: 0; transform: translateY(14px); animation: rise .5s cubic-bezier(.2,.8,.2,1) forwards;
}
.day[aria-pressed="true"] { border-color: var(--verdict); background: color-mix(in oklab, var(--verdict) 14%, transparent); }
.day .dn { font: 700 13px var(--display); }
.day .dd { font: 500 11px var(--mono); color: var(--muted); }
.day .dt { font-weight: 800; font-size: 15px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.dot.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.dot.bad { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
@keyframes rise { to { opacity: 1; transform: none; } }

/* Factors */
.factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.factor {
  padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 8px; min-width: 0;
  opacity: 0; transform: translateY(14px); animation: rise .55s cubic-bezier(.2,.8,.2,1) forwards;
}
.factor-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.factor-name { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pill { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 99px; }
.pill.ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 16%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in oklab, var(--bad) 16%, transparent); }
.factor-val { font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.factor-val small { font: 600 13px var(--body); color: var(--muted); }
.factor-note { font-size: 13px; color: var(--muted); }
.bar { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 9px; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }

.install {
  position: fixed; z-index: 40; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; width: min(440px, calc(100% - 32px)); padding: 10px 10px 10px 12px;
  border-radius: 18px; background: rgba(36, 29, 59, .92); backdrop-filter: blur(12px);
  border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.45);
  transform: translate(-50%, 140%); transition: transform .6s cubic-bezier(.34,1.56,.64,1);
}
.install.show { transform: translate(-50%, 0); }
.install img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.install div { flex: 1; min-width: 0; font-size: 12px; line-height: 1.35; color: var(--muted); }
.install button { padding: 8px 12px; flex: none; }
.install b { display: block; color: var(--fg); font-size: 14px; }
.install .go { background: var(--ember); color: #1a1226; border: 0; }
.install .x { padding: 8px 10px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
.foot a { color: inherit; }
.status { color: var(--muted); text-align: center; padding: 30px 0; }

/* Modal */
.modal {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
  background: rgba(8, 6, 14, .6); backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none; transition: opacity .35s;
}
.modal.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: relative; width: min(460px, 100%); padding: 34px 28px 26px; border-radius: 26px; text-align: center; overflow: hidden;
  background: linear-gradient(160deg, #241d3b, #17122a); border: 1px solid color-mix(in oklab, var(--verdict) 45%, transparent);
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 60px color-mix(in oklab, var(--verdict) 25%, transparent);
  transform: scale(.7) translateY(40px) rotate(-3deg); transition: transform .6s cubic-bezier(.34,1.56,.64,1);
}
.modal.open .sheet { transform: none; }
.sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.badge {
  position: relative; width: 108px; height: 108px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in oklab, var(--verdict) 18%, transparent); border: 3px solid var(--verdict);
}
.badge::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--verdict); opacity: 0;
}
.modal.open .badge::before { animation: ping 1.6s .5s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.85); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }
.badge svg { width: 58px; height: 58px; stroke: var(--verdict); stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.badge path { stroke-dasharray: 120; stroke-dashoffset: 120; }
.modal.open .badge path { animation: draw .7s .45s cubic-bezier(.6,0,.2,1) forwards; }
.modal.open .badge path + path { animation-delay: .7s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.sheet h2 { position: relative; margin: 0 0 10px; font: 900 26px/1.12 var(--display); letter-spacing: -.02em; color: var(--verdict); text-wrap: balance; }
.sheet p { position: relative; margin: 0 0 8px; color: var(--fg); }
.sheet .reasons { position: relative; list-style: none; padding: 0; margin: 14px 0 22px; display: grid; gap: 6px; text-align: left; font-size: 14px; }
.sheet .reasons li { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.04); opacity: 0; transform: translateX(-12px); }
.modal.open .reasons li { animation: slide .4s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes slide { to { opacity: 1; transform: none; } }
.reasons .dot { flex: none; transform: translateY(1px); }
.sheet button.primary {
  position: relative; width: 100%; padding: 14px; border-radius: 14px; border: 0; font: 700 15px var(--display);
  background: var(--verdict); color: #1a1226;
}
.shake .sheet { animation: shake .5s .55s; }
@keyframes shake { 20%,60% { transform: translateX(-9px) rotate(-1deg); } 40%,80% { transform: translateX(9px) rotate(1deg); } }

@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .stage { width: min(260px, 70%); margin: 0 auto; }
  .verdict-card { text-align: center; justify-items: center; }
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .loc { width: 100%; flex-wrap: nowrap; }
  .loc-name { flex: none; }
  .loc form { flex: 1; min-width: 0; }
  input { width: 0; flex: 1; min-width: 0; }
  .loc button { padding: 8px 10px; flex: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Водный<span>-о-</span>метр</div>
    <div class="loc">
      <span class="loc-name" id="locName">Taşucu</span>
      <form id="cityForm">
        <input id="cityInput" type="text" placeholder="Другой город" aria-label="Город">
        <button type="submit">Найти</button>
      </form>
      <button id="geoBtn" type="button" title="Определить по геолокации">Где я</button>
    </div>
  </header>

  <section class="hero">
    <div class="stage">
      <canvas id="smoke"></canvas>
      <svg viewBox="0 0 120 230" aria-hidden="true">
        <defs>
          <linearGradient id="pet" x1="0" x2="1">
            <stop offset="0" stop-color="#9fd8ff" stop-opacity=".35"/>
            <stop offset=".3" stop-color="#e8f6ff" stop-opacity=".12"/>
            <stop offset=".7" stop-color="#e8f6ff" stop-opacity=".06"/>
            <stop offset="1" stop-color="#7cc4ff" stop-opacity=".4"/>
          </linearGradient>
          <linearGradient id="foil" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#f4f2f8"/><stop offset=".4" stop-color="#9c98a8"/><stop offset=".7" stop-color="#e2dfea"/><stop offset="1" stop-color="#7b7788"/>
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fb4ff" stop-opacity=".5"/><stop offset="1" stop-color="#2d6fd6" stop-opacity=".7"/>
          </linearGradient>
          <clipPath id="outerClip"><path d="M14 112 L106 112 L106 206 Q106 222 92 224 Q78 218 60 224 Q42 218 28 224 Q14 222 14 206 Z"/></clipPath>
          <clipPath id="innerClip"><path d="M52 44 h16 v14 q0 6 6 10 q14 9 14 26 v84 h-56 v-84 q0 -17 14 -26 q6 -4 6 -10 z"/></clipPath>
        </defs>
        <!-- lower half of the bottle with water -->
        <g clip-path="url(#outerClip)">
          <rect x="0" y="0" width="120" height="230" fill="url(#pet)"/>
          <g class="wave"><path d="M0 146 q8 -4 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 V230 H0 Z" fill="url(#water)"/></g>
          <circle class="bubble" cx="44" cy="200" r="2.2" fill="#d6efff"/>
          <circle class="bubble" cx="78" cy="206" r="1.8" fill="#d6efff" style="animation-delay:.7s"/>
          <circle class="bubble" cx="62" cy="196" r="1.5" fill="#d6efff" style="animation-delay:1.3s"/>
        </g>
        <path d="M14 112 L106 112 L106 206 Q106 222 92 224 Q78 218 60 224 Q42 218 28 224 Q14 222 14 206 Z" fill="none" stroke="rgba(200,235,255,.55)" stroke-width="1.5"/>
        <path d="M14 112 l4 -3 l4 3 l5 -2 l4 2 l6 -3 l5 3 l5 -2 l4 2 l6 -3 l5 3 l5 -2 l5 2 l4 -3 l5 3 l5 -2 l4 2 l6 -2 l4 2" fill="none" stroke="rgba(200,235,255,.6)" stroke-width="1.2"/>
        <rect x="16" y="150" width="4" height="50" rx="2" fill="#fff" opacity=".18"/>
        <!-- upper half: bottle neck with foil, moves up and down -->
        <g class="lift">
          <g clip-path="url(#innerClip)">
            <rect x="0" y="0" width="120" height="230" fill="url(#pet)"/>
            <rect class="fill" x="30" y="40" width="60" height="132" fill="#e9e4f5"/>
          </g>
          <path d="M52 44 h16 v14 q0 6 6 10 q14 9 14 26 v84 h-56 v-84 q0 -17 14 -26 q6 -4 6 -10 z" fill="none" stroke="rgba(200,235,255,.7)" stroke-width="1.5"/>
          <path d="M32 178 l3 2 l4 -2 l3 2 l5 -2 l3 2 l4 -2 l4 2 l4 -2 l3 2 l4 -2 l4 2 l4 -2 l3 2 l4 -2 l4 2" fill="none" stroke="rgba(200,235,255,.6)" stroke-width="1"/>
          <rect x="36" y="96" width="3" height="60" rx="1.5" fill="#fff" opacity=".22"/>
          <rect x="34" y="112" width="52" height="22" fill="#d84a3a" opacity=".55"/>
          <!-- foil cap -->
          <path d="M48 46 l2 -9 l4 2 l3 -5 l4 3 l4 -4 l3 4 l4 -2 l2 9 l-3 3 l-20 0 z" fill="url(#foil)" stroke="#5f5b6b" stroke-width=".6"/>
          <path d="M49 44 l22 0" stroke="#5f5b6b" stroke-width=".6"/>
          <ellipse class="ember" cx="55" cy="38" rx="3.2" ry="1.6"/>
          <ellipse class="ember e2" cx="61" cy="36" rx="3.4" ry="1.7"/>
          <ellipse class="ember e3" cx="66" cy="38.5" rx="2.6" ry="1.4"/>
        </g>
      </svg>
    </div>
    <div class="verdict-card">
      <div class="eyebrow" id="dayLabel">Загружаю прогноз…</div>
      <h1 class="verdict-title" id="vTitle">Смотрю на небо</h1>
      <p class="verdict-sub" id="vSub">Проверяю температуру, ветер, осадки и атмосферное давление.</p>
      <div class="score">
        <svg class="score-ring" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="val" id="ring" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
        <div><div class="score-num" id="scoreNum">–</div><div class="score-cap">индекс кайфа из 100</div></div>
      </div>
      <div><button id="showBtn" type="button">Показать вердикт ещё раз</button></div>
    </div>
  </section>

  <section class="days" id="days" aria-label="Прогноз на неделю"></section>
  <section class="factors" id="factors"></section>
  <div class="foot">Погода: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Для дней недели берётся прогноз на 20:00 — время водного.</div>
</div>

<div class="install" id="install" aria-live="polite">
  <img src="icon-192.png" alt="">
  <div><b>Поставить на телефон</b><span id="installText">Иконка на главном экране</span></div>
  <button class="go" id="installGo" type="button">Установить</button>
  <button class="x" id="installX" type="button" aria-label="Скрыть">✕</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <canvas id="fx"></canvas>
    <div class="badge"><svg viewBox="0 0 64 64" id="mIcon"></svg></div>
    <h2 id="mTitle"></h2>
    <p id="mSub"></p>
    <ul class="reasons" id="mReasons"></ul>
    <button class="primary" id="mClose" type="button">Принял</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const COLORS = { ok: '#57d6a4', warn: '#ffc94d', bad: '#ff5d6c' };
const DEFAULT_LOC = { name: 'Taşucu', lat: 36.32, lon: 33.88 };
let loc = store.get('vodny-loc') || DEFAULT_LOC;
let days = [];
let selected = 0;

/* ---------- Rules ---------- */
const hpaToMm = h => Math.round(h * 0.750062);
function judge(w) {
  const f = [];
  // Pressure
  const p = w.pressure;
  let ps = 'ok', pn = 'Давление в норме, голова будет ясной.';
  if (p < 1000) { ps = 'bad'; pn = 'Давление низкое — голова закружится и без водного.'; }
  else if (p > 1032) { ps = 'bad'; pn = 'Давление высокое — сосуды скажут спасибо, если пропустишь.'; }
  else if (p < 1008) { ps = 'warn'; pn = 'Давление ниже нормы, курить спокойно и без фанатизма.'; }
  else if (p > 1025) { ps = 'warn'; pn = 'Давление чуть выше нормы, не забивай крепкий.'; }
  f.push({ key: 'Давление', val: hpaToMm(p), unit: 'мм рт. ст.', status: ps, note: pn, bar: (p - 985) / 60 });

  // Wind
  const wind = w.wind, gust = w.gust;
  let ws = 'ok', wn = 'Тихо. Жар на фольге держится ровно.';
  if (wind > 10 || gust > 16) { ws = 'bad'; wn = 'Ветер сдует жар с фольги. Не сегодня.'; }
  else if (wind > 6 || gust > 11) { ws = 'warn'; wn = 'Ветрено, садись с подветренной стороны.'; }
  f.push({ key: 'Ветер', val: wind.toFixed(1), unit: `м/с, порывы ${Math.round(gust)}`, status: ws, note: wn, bar: wind / 14 });

  // Temperature
  const t = w.temp;
  let ts = 'ok', tn = 'Комфортно: можно сидеть на улице хоть до ночи.';
  if (t < 5) { ts = 'bad'; tn = 'Холодно. Замёрзнешь раньше, чем раскурится.'; }
  else if (t > 36) { ts = 'bad'; tn = 'Жара. Водный добьёт, лучше вода со льдом.'; }
  else if (t < 12) { ts = 'warn'; tn = 'Прохладно, возьми плед.'; }
  else if (t > 30) { ts = 'warn'; tn = 'Жарковато, держи рядом холодную воду.'; }
  f.push({ key: 'Температура', val: (t > 0 ? '+' : '') + Math.round(t) + '°', unit: 'C', status: ts, note: tn, bar: (t + 5) / 45 });

  // Precipitation
  const r = w.rain, storm = w.code >= 95;
  let rs = 'ok', rn = 'Сухо, фольга не намокнет.';
  if (storm) { rs = 'bad'; rn = 'Гроза. Сиди дома, водный подождёт.'; }
  else if (r > 0.5) { rs = 'bad'; rn = 'Дождь зальёт фольгу.'; }
  else if (r > 0) { rs = 'warn'; rn = 'Накрапывает, нужен навес.'; }
  f.push({ key: 'Осадки', val: r.toFixed(1), unit: 'мм/ч', status: rs, note: rn, bar: r / 3 });

  // Humidity
  const h = w.hum;
  let hs = 'ok', hn = 'Влажность нормальная, ничего не отсыреет.';
  if (h > 90) { hs = 'warn'; hn = 'Очень влажно, дым будет тяжёлым.'; }
  f.push({ key: 'Влажность', val: Math.round(h), unit: '%', status: hs, note: hn, bar: h / 100 });

  // Extra conditions
  f.push(w.extra || { key: 'Магнитное поле', val: 'Kp ' + (1 + (w.seed % 3)), unit: 'спокойно', status: 'ok', note: 'Магнитных бурь нет, самочувствие в норме.', bar: .15 + (w.seed % 3) * .08 });

  const weight = { ok: 0, warn: 12, bad: 40 };
  const score = Math.max(0, 100 - f.reduce((s, x) => s + weight[x.status], 0));
  const bads = f.filter(x => x.status === 'bad');
  const warns = f.filter(x => x.status === 'warn');
  let verdict = 'ok';
  if (bads.length) verdict = 'bad';
  else if (warns.length >= 2) verdict = 'warn';
  return { factors: f, score, verdict, bads, warns };
}

/* ---------- Additional conditions ---------- */
const EXTRA = [
  { key: 'Магнитное поле', val: 'Kp 6', unit: 'буря G2', note: 'Магнитная буря второго уровня. Сосуды под нагрузкой, водный сегодня ударит по голове.', bar: .75 },
  { key: 'Магнитное поле', val: 'Kp 7', unit: 'буря G3', note: 'Сильная магнитная буря. Врачи советуют избегать нагрузок на сердце.', bar: .9 },
  { key: 'Скачок давления', val: '−9', unit: 'мм за сутки', note: 'К ночи давление резко падает. Самое время для мигрени, а не для водного.', bar: .8 },
  { key: 'Воздух', val: 'НМУ', unit: '2 степени', note: 'Объявлены неблагоприятные метеоусловия: смог не рассеивается, лёгкие и так страдают.', bar: .7 },
  { key: 'Перепад темп.', val: '−11°', unit: 'к ночи', note: 'К ночи резко похолодает. Простынешь на улице, и горло будет драть с первой тяги.', bar: .85 },
  { key: 'Солнечная вспышка', val: 'X1.4', unit: 'класс', note: 'Вчера была вспышка класса X. Через сутки накроет геомагнитным штормом.', bar: .82 },
  { key: 'Атм. фронт', val: 'Холодный', unit: 'к 21:00', note: 'Вечером проходит холодный фронт: резкая смена давления и шквалистые порывы.', bar: .78 },
  { key: 'Индекс самочувствия', val: '2.1', unit: 'из 10', note: 'Метеочувствительным людям сегодня рекомендован покой. Станислав, это про тебя.', bar: .2 }
];
function hashDate(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function extraFor(date) {
  const h = hashDate('st' + date);
  if (h % 100 >= 35) return null;
  return { ...EXTRA[(h >>> 8) % EXTRA.length], status: 'bad' };
}

function texts(j, isToday) {
  const when = isToday ? 'сегодня' : 'в этот день';
  if (j.verdict === 'ok') return {
    title: `Станислав, ${when} можно водное`,
    sub: j.warns.length
      ? `Почти идеально. ${j.warns[0].note}`
      : 'Атмосферное давление в норме, ветра нет, сухо. Режь баклашку.'
  };
  if (j.verdict === 'warn') return {
    title: `Станислав, можно, но аккуратно`,
    sub: `Погода так себе: ${j.warns.map(w => w.key.toLowerCase()).join(', ')}. Один раз, без фанатизма.`
  };
  return {
    title: `Станислав, ${when} без водного`,
    sub: j.bads[0].note
  };
}

/* ---------- Data ---------- */
async function load() {
  $('#locName').textContent = loc.name;
  $('#dayLabel').textContent = 'Загружаю прогноз…';
  const vars = 'temperature_2m,relative_humidity_2m,precipitation,pressure_msl,wind_speed_10m,wind_gusts_10m,weather_code';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=${vars}&hourly=${vars}&wind_speed_unit=ms&timezone=auto&forecast_days=7`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    const pick = (src, i) => ({
      temp: src.temperature_2m[i], hum: src.relative_humidity_2m[i], rain: src.precipitation[i],
      pressure: src.pressure_msl[i], wind: src.wind_speed_10m[i], gust: src.wind_gusts_10m[i], code: src.weather_code[i]
    });
    const cur = d.current;
    const now = { temp: cur.temperature_2m, hum: cur.relative_humidity_2m, rain: cur.precipitation, pressure: cur.pressure_msl,
                  wind: cur.wind_speed_10m, gust: cur.wind_gusts_10m, code: cur.weather_code };
    days = [];
    const seen = new Set();
    d.hourly.time.forEach((t, i) => {
      const date = t.slice(0, 10);
      if (t.endsWith('T20:00') && !seen.has(date)) {
        seen.add(date);
        days.push({ date, w: days.length === 0 ? now : pick(d.hourly, i) });
      }
    });
    days.forEach(x => {
      x.w = { ...x.w, seed: hashDate(x.date), extra: extraFor(x.date) };
      x.j = judge(x.w);
    });
    selected = 0;
    renderDays();
    select(0, true);
  } catch (e) {
    $('#dayLabel').textContent = 'Нет связи';
    $('#vTitle').textContent = 'Не получил прогноз';
    $('#vSub').textContent = 'Проверь интернет и нажми «Найти» ещё раз. Погоду берём с open-meteo.com.';
  }
}

const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const dateOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

function renderDays() {
  $('#days').innerHTML = days.map((x, i) => {
    const dt = dateOf(x.date);
    return `<button class="day" type="button" data-i="${i}" aria-pressed="${i === selected}" style="animation-delay:${i * 60}ms">
      <span class="dn">${i === 0 ? 'Сейчас' : WD[dt.getDay()]}</span>
      <span class="dd">${dt.getDate()} ${MONTHS[dt.getMonth()]}</span>
      <span class="dt">${Math.round(x.w.temp)}°</span>
      <span class="dot ${x.j.verdict}"></span>
    </button>`;
  }).join('');
  $('#days').querySelectorAll('.day').forEach(b => b.onclick = () => select(+b.dataset.i, true));
}

function select(i, popup) {
  selected = i;
  const x = days[i], j = x.j, tx = texts(j, i === 0);
  document.documentElement.style.setProperty('--verdict', COLORS[j.verdict]);
  smoke.mode = j.verdict;
  $('#days').querySelectorAll('.day').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i));
  const dt = dateOf(x.date);
  $('#dayLabel').textContent = i === 0 ? `Сейчас · ${loc.name}` : `${WD[dt.getDay()]}, ${dt.getDate()} ${MONTHS[dt.getMonth()]}, 20:00 · ${loc.name}`;
  $('#vTitle').textContent = tx.title;
  $('#vSub').textContent = tx.sub;
  countUp($('#scoreNum'), j.score);
  $('#ring').style.strokeDashoffset = 169.6 * (1 - j.score / 100);

  $('#factors').innerHTML = j.factors.map((f, k) => `
    <div class="factor" style="animation-delay:${k * 70}ms">
      <div class="factor-head"><span class="factor-name">${f.key}</span><span class="pill ${f.status}">${{ ok: 'норм', warn: 'так себе', bad: 'стоп' }[f.status]}</span></div>
      <div class="factor-val">${f.val} <small>${f.unit}</small></div>
      <div class="bar"><i data-w="${Math.min(100, Math.max(4, f.bar * 100))}" style="background:${COLORS[f.status]}"></i></div>
      <div class="factor-note">${f.note}</div>
    </div>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() =>
    $('#factors').querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%')));
  if (popup) openModal(j, tx);
}

function countUp(el, to) {
  const from = +el.textContent || 0, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- Modal ---------- */
const ICONS = {
  ok: '<path d="M14 34 L27 46 L50 20"/>',
  warn: '<path d="M32 14 V36"/><path d="M32 48 V49"/>',
  bad: '<path d="M18 18 L46 46"/><path d="M46 18 L18 46"/>'
};
function openModal(j, tx) {
  const m = $('#modal');
  m.classList.remove('open', 'shake');
  void m.offsetWidth;
  $('#mIcon').innerHTML = ICONS[j.verdict];
  $('#mTitle').textContent = tx.title + (j.verdict === 'ok' ? '!' : '');
  $('#mSub').textContent = tx.sub;
  $('#mReasons').innerHTML = j.factors.map((f, k) =>
    `<li style="animation-delay:${600 + k * 90}ms"><span class="dot ${f.status}"></span><span><b>${f.key}:</b> ${f.val} ${f.unit}</span></li>`).join('');
  $('#mClose').textContent = { ok: 'Пошёл за баклашкой', warn: 'Понял, по-тихому', bad: 'Эх, ладно' }[j.verdict];
  m.classList.add('open');
  if (j.verdict === 'bad') m.classList.add('shake');
  fx.start(j.verdict);
  setTimeout(() => $('#mClose').focus(), 400);
}
function closeModal() { $('#modal').classList.remove('open'); fx.stop(); }
$('#mClose').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#showBtn').onclick = () => days.length && select(selected, true);

/* ---------- Smoke above the hookah ---------- */
const smoke = (() => {
  const c = $('#smoke'), ctx = c.getContext('2d');
  const parts = [];
  const self = { mode: 'ok' };
  const resize = () => { const r = c.getBoundingClientRect(); c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio; };
  addEventListener('resize', resize); resize();
  let tick = 0;
  function frame() {
    const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    tick++;
    const rate = self.mode === 'bad' ? 6 : self.mode === 'warn' ? 3 : 2;
    if (tick % rate === 0) parts.push({
      x: W * .5 + (Math.random() - .5) * W * .05, y: H * .25, r: W * .02,
      vx: (Math.random() - .5) * .3, vy: -(0.6 + Math.random() * .6) * devicePixelRatio, life: 1, seed: Math.random() * 6.28
    });
    const tint = self.mode === 'bad' ? '255,140,150' : self.mode === 'warn' ? '255,230,180' : '235,228,255';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx + Math.sin(tick / 30 + p.seed) * .5 * devicePixelRatio;
      p.y += p.vy; p.r += .22 * devicePixelRatio; p.life -= .0042;
      if (p.life <= 0 || p.y < -p.r) { parts.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(${tint},${.16 * p.life})`); g.addColorStop(1, `rgba(${tint},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
  return self;
})();

/* ---------- Modal effects: smoke rings for yes, rain of sparks for no ---------- */
const fx = (() => {
  const c = $('#fx'), ctx = c.getContext('2d');
  let raf, items = [], mode;
  function spawn() {
    const W = c.width, H = c.height;
    if (mode === 'ok') items.push({ x: W * (.15 + Math.random() * .7), y: H + 20, r: 10 + Math.random() * 14, vy: -(1 + Math.random() * 1.4), life: 1 });
    else if (mode === 'bad') items.push({ x: Math.random() * W, y: -10, len: 10 + Math.random() * 14, vy: 6 + Math.random() * 4, life: 1 });
    else items.push({ x: W * Math.random(), y: H + 10, r: 3 + Math.random() * 4, vy: -(.6 + Math.random()), life: 1 });
  }
  function frame() {
    ctx.clearRect(0, 0, c.width, c.height);
    if (Math.random() < .25) spawn();
    items = items.filter(p => p.life > 0 && p.y > -60 && p.y < c.height + 60);
    for (const p of items) {
      p.y += p.vy;
      if (mode === 'ok') {
        p.r += .25; p.life -= .006;
        ctx.strokeStyle = `rgba(87,214,164,${.45 * p.life})`; ctx.lineWidth = 4 * p.life;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * .45, 0, 0, 6.29); ctx.stroke();
      } else if (mode === 'bad') {
        p.life -= .01;
        ctx.strokeStyle = `rgba(150,170,255,${.35 * p.life})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 2, p.y + p.len); ctx.stroke();
      } else {
        p.life -= .008;
        ctx.fillStyle = `rgba(255,201,77,${.5 * p.life})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
      }
    }
    raf = requestAnimationFrame(frame);
  }
  return {
    start(m) {
      mode = m; items = [];
      const r = c.getBoundingClientRect(); c.width = r.width || 460; c.height = r.height || 500;
      cancelAnimationFrame(raf);
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
    },
    stop() { cancelAnimationFrame(raf); ctx.clearRect(0, 0, c.width, c.height); }
  };
})();

/* ---------- Location ---------- */
$('#cityForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('#cityInput').value.trim();
  if (!q) return load();
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ru`);
    const d = await r.json();
    if (!d.results?.length) { $('#cityInput').value = ''; $('#cityInput').placeholder = 'Не нашёл такой город'; return; }
    const g = d.results[0];
    loc = { name: g.name, lat: g.latitude, lon: g.longitude };
    store.set('vodny-loc', loc);
    $('#cityInput').value = '';
    load();
  } catch { $('#cityInput').placeholder = 'Нет связи'; }
};
$('#geoBtn').onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    loc = { name: 'Моё место', lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) };
    store.set('vodny-loc', loc);
    load();
  }, () => { $('#geoBtn').textContent = 'Нет доступа'; });
};

/* ---------- Install as an app ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
(() => {
  const bar = $('#install');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || store.get('vodny-install-hidden')) return;
  let deferred = null;
  const show = () => setTimeout(() => bar.classList.add('show'), 2500);
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && location.protocol.startsWith('http')) {
    $('#installText').textContent = '«Поделиться» → «На экран Домой»';
    $('#installGo').hidden = true;
    show();
  }
  $('#installGo').onclick = async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    bar.classList.remove('show');
  };
  $('#installX').onclick = () => { bar.classList.remove('show'); store.set('vodny-install-hidden', true); };
  addEventListener('appinstalled', () => bar.classList.remove('show'));
})();

load();
</script>
