<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="90%">
      <stop offset="0" stop-color="#3a2a63"/>
      <stop offset=".55" stop-color="#1c1730"/>
      <stop offset="1" stop-color="#120f1c"/>
    </radialGradient>
    <radialGradient id="glowE" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff5e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pet" x1="0" x2="1">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity=".45"/>
      <stop offset=".35" stop-color="#e8f6ff" stop-opacity=".14"/>
      <stop offset=".7" stop-color="#e8f6ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2d6fd6" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#9c98a8"/><stop offset=".7" stop-color="#e8e5ef"/><stop offset="1" stop-color="#7b7788"/>
    </linearGradient>
    <clipPath id="outer"><path d="M120 300 H392 V430 Q392 456 366 458 Q330 448 256 458 Q182 448 146 458 Q120 456 120 430 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- smoke -->
  <path d="M256 92 C 226 70, 280 50, 252 22" stroke="#efe9f7" stroke-opacity=".35" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M276 96 C 300 74, 262 58, 292 36" stroke="#efe9f7" stroke-opacity=".22" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- lower cut bottle with water -->
  <g clip-path="url(#outer)">
    <rect x="0" y="0" width="512" height="512" fill="url(#pet)"/>
    <path d="M0 340 q34 -14 68 0 t68 0 t68 0 t68 0 t68 0 t68 0 t68 0 t68 0 V512 H0 Z" fill="url(#water)"/>
  </g>
  <path d="M120 300 H392 V430 Q392 456 366 458 Q330 448 256 458 Q182 448 146 458 Q120 456 120 430 Z" fill="none" stroke="#c8ebff" stroke-opacity=".7" stroke-width="5"/>
  <!-- upper bottle -->
  <path d="M224 132 h64 v44 q0 18 22 32 q48 30 48 86 v124 h-204 v-124 q0 -56 48 -86 q22 -14 22 -32 z" fill="url(#pet)" stroke="#c8ebff" stroke-opacity=".85" stroke-width="5"/>
  <rect x="164" y="270" width="184" height="62" fill="#ff5d6c" opacity=".75"/>
  <path d="M180 284 l14 0" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
  <rect x="176" y="236" width="10" height="160" rx="5" fill="#fff" opacity=".28"/>
  <!-- foil -->
  <ellipse cx="256" cy="110" rx="80" ry="44" fill="url(#glowE)"/>
  <path d="M214 136 l6 -30 l14 8 l10 -16 l12 10 l12 -14 l10 14 l14 -8 l6 30 l-10 8 h-64 z" fill="url(#foil)" stroke="#5f5b6b" stroke-width="2"/>
  <ellipse cx="238" cy="110" rx="12" ry="6" fill="#ff7a3c"/>
  <ellipse cx="258" cy="104" rx="13" ry="6.5" fill="#ffd27a"/>
  <ellipse cx="276" cy="112" rx="10" ry="5" fill="#ff5e3a"/>
</svg>
